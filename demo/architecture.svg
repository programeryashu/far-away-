<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" font-family="Inter, -apple-system, Segoe UI, sans-serif">
  <rect width="960" height="560" fill="#0b0b0f"/>
  <text x="40" y="52" fill="#e8e8ea" font-size="26" font-weight="700">Orbit — architecture</text>
  <text x="40" y="78" fill="#8a8a93" font-size="14">One protocol · one event sequence · one database</text>

  <!-- System diagram -->
  <g>
    <text x="40" y="128" fill="#a9a9b2" font-size="13" font-weight="600" letter-spacing="1">SYSTEM</text>

    <!-- User A -->
    <rect x="40" y="150" width="150" height="52" rx="8" fill="#16161c" stroke="#2a2a33"/>
    <circle cx="62" cy="176" r="9" fill="#3ddc84"/>
    <text x="78" y="181" fill="#e8e8ea" font-size="14">User A</text>

    <!-- User B -->
    <rect x="250" y="150" width="150" height="52" rx="8" fill="#16161c" stroke="#2a2a33"/>
    <circle cx="272" cy="176" r="9" fill="#3ddc84"/>
    <text x="288" y="181" fill="#e8e8ea" font-size="14">User B</text>

    <!-- Clients -->
    <rect x="40" y="250" width="150" height="52" rx="8" fill="#16161c" stroke="#2a2a33"/>
    <text x="60" y="274" fill="#c9c9d1" font-size="14">Orbit client</text>
    <text x="60" y="292" fill="#8a8a93" font-size="11">time · moment · UI</text>

    <rect x="250" y="250" width="150" height="52" rx="8" fill="#16161c" stroke="#2a2a33"/>
    <text x="270" y="274" fill="#c9c9d1" font-size="14">Orbit client</text>
    <text x="270" y="292" fill="#8a8a93" font-size="11">time · moment · UI</text>

    <!-- arrows A->client -->
    <path d="M115 202 V250" stroke="#3a3a45" stroke-width="1.5"/>
    <path d="M325 202 V250" stroke="#3a3a45" stroke-width="1.5"/>

    <!-- Connection -->
    <rect x="120" y="340" width="200" height="56" rx="8" fill="#1b1b22" stroke="#3ddc84" stroke-width="1.5"/>
    <text x="140" y="365" fill="#e8e8ea" font-size="14" font-weight="600">Connection</text>
    <text x="140" y="384" fill="#8a8a93" font-size="11">local: BroadcastChannel · remote: WebSocket</text>

    <path d="M115 302 V340" stroke="#3a3a45" stroke-width="1.5"/>
    <path d="M325 302 V340" stroke="#3a3a45" stroke-width="1.5"/>

    <!-- Session hub -->
    <rect x="120" y="440" width="200" height="56" rx="8" fill="#16161c" stroke="#2a2a33"/>
    <text x="140" y="465" fill="#c9c9d1" font-size="14">Session Hub</text>
    <text x="140" y="484" fill="#8a8a93" font-size="11">validate · sequence · broadcast</text>
    <path d="M220 396 V440" stroke="#3a3a45" stroke-width="1.5"/>

    <!-- Event log -->
    <rect x="420" y="440" width="200" height="56" rx="8" fill="#16161c" stroke="#2a2a33"/>
    <text x="440" y="465" fill="#c9c9d1" font-size="14">Event log</text>
    <text x="440" y="484" fill="#8a8a93" font-size="11">append-only · server seq</text>
    <path d="M320 468 H420" stroke="#3a3a45" stroke-width="1.5"/>

    <!-- SQLite -->
    <rect x="720" y="440" width="200" height="56" rx="8" fill="#16161c" stroke="#3ddc84" stroke-width="1.5"/>
    <text x="740" y="465" fill="#e8e8ea" font-size="14" font-weight="600">SQLite</text>
    <text x="740" y="484" fill="#8a8a93" font-size="11">sessions · events · state</text>
    <path d="M620 468 H720" stroke="#3a3a45" stroke-width="1.5"/>
  </g>

  <!-- Data flow -->
  <g>
    <text x="40" y="546" fill="#a9a9b2" font-size="13" font-weight="600" letter-spacing="1">SHARED MOMENT</text>
    <rect x="40" y="570" width="200" height="52" rx="8" fill="#16161c" stroke="#2a2a33"/>
    <text x="60" y="594" fill="#c9c9d1" font-size="13">Time + Location Facts</text>
    <text x="60" y="611" fill="#8a8a93" font-size="11">deterministic math</text>
    <path d="M240 596 H290" stroke="#3a3a45" stroke-width="1.5"/>
    <rect x="290" y="570" width="180" height="52" rx="8" fill="#16161c" stroke="#2a2a33"/>
    <text x="310" y="594" fill="#c9c9d1" font-size="13">Shared Moment</text>
    <text x="310" y="611" fill="#8a8a93" font-size="11">AI interprets facts</text>
    <path d="M470 596 H520" stroke="#3a3a45" stroke-width="1.5"/>
    <rect x="520" y="570" width="180" height="52" rx="8" fill="#16161c" stroke="#2a2a33"/>
    <text x="540" y="594" fill="#c9c9d1" font-size="13">Recommendation</text>
    <text x="540" y="611" fill="#8a8a93" font-size="11">validated with Zod</text>
    <path d="M700 596 H750" stroke="#3a3a45" stroke-width="1.5"/>
    <rect x="750" y="570" width="170" height="52" rx="8" fill="#1b1b22" stroke="#3ddc84" stroke-width="1.5"/>
    <text x="770" y="594" fill="#e8e8ea" font-size="13" font-weight="600">Realtime Event</text>
    <text x="770" y="611" fill="#8a8a93" font-size="11">same system as all</text>
  </g>

  <rect width="960" height="680" fill="none"/>
</svg>
